<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JD Disqualifier Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; width: 400px; min-height: 200px; }

    .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155; padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
    .header-icon { font-size: 20px; }
    .header h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .header p { font-size: 10px; color: #64748b; margin-top: 2px; }

    .body { padding: 14px 18px; }

    .scan-btn { width: 100%; padding: 11px 0; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.3px; }
    .scan-btn:hover { background: #2563eb; }
    .scan-btn:disabled { background: #1e3a5f; color: #475569; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 11px; color: #64748b; text-align: center; min-height: 16px; }
    .results { margin-top: 12px; }
    .mode-hint { font-size: 10px; color: #475569; text-align: center; margin-top: 10px; line-height: 1.5; }

    .warning-card { background: #1a0505; border: 2px solid #dc2626; border-radius: 10px; padding: 16px; margin-bottom: 6px; }
    .warning-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: #ef4444; margin-bottom: 6px; }
    .warning-subtitle { font-size: 11px; color: #f87171; margin-bottom: 12px; line-height: 1.5; }
    .exit-banner { background: #dc2626; color: #fff; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
    .flagged-keywords { display: flex; flex-wrap: wrap; gap: 6px; }
    .flagged-tag { background: #7f1d1d; color: #fca5a5; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.15s; }
    .flagged-tag:hover { background: #991b1b; }

    .proceed-card { background: #052e16; border: 2px solid #16a34a; border-radius: 10px; padding: 16px; }
    .proceed-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #4ade80; margin-bottom: 6px; }
    .proceed-subtitle { font-size: 11px; color: #86efac; line-height: 1.5; }
    .proceed-banner { background: #16a34a; color: #fff; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; padding: 8px; border-radius: 6px; margin-top: 12px; }

    .footer { padding: 8px 18px 12px; text-align: center; font-size: 10px; color: #334155; border-top: 1px solid #1a2235; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🔍</span>
    <div>
      <h1>JD Disqualifier Checker</h1>
      <p>Clearance · Onsite · Hybrid · FedRAMP · In-person · Travel</p>
    </div>
  </div>

  <div class="body">
    <button class="scan-btn" id="scanBtn">Rescan This Page</button>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

  <div class="footer">JD Disqualifier Checker v3.1</div>

  <script src="popup.js"></script>
</body>
</html>
