<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JD Disqualifier Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 400px;
      min-height: 200px;
    }

    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 20px; }
    .header h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .header p  { font-size: 10px; color: #64748b; margin-top: 2px; }

    /* ── Mode Toggle ── */
    .mode-toggle {
      display: flex;
      margin: 14px 18px 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn.active {
      background: #3b82f6;
      color: #fff;
    }

    /* ── Body ── */
    .body { padding: 14px 18px; }

    .scan-btn {
      width: 100%;
      padding: 11px 0;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.3px;
    }
    .scan-btn:hover    { background: #2563eb; }
    .scan-btn:disabled { background: #1e3a5f; color: #475569; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }

    .results { margin-top: 12px; }

    /* ── WARNING CARD (Resume mode — flagged) ── */
    .warning-card {
      background: #1a0505;
      border: 2px solid #dc2626;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      animation: pulse-border 1.5s ease-in-out 2;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #dc2626; }
      50%       { border-color: #ff6b6b; box-shadow: 0 0 14px rgba(220,38,38,0.5); }
    }
    .warning-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #ef4444;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .warning-subtitle {
      font-size: 11px;
      color: #f87171;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .exit-banner {
      background: #dc2626;
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .flagged-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .flagged-tag {
      background: #7f1d1d;
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── PROCEED CARD (Resume mode — clean) ── */
    .proceed-card {
      background: #052e16;
      border: 2px solid #16a34a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .proceed-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #4ade80;
      margin-bottom: 6px;
    }
    .proceed-subtitle {
      font-size: 11px;
      color: #86efac;
      line-height: 1.5;
    }
    .proceed-banner {
      background: #16a34a;
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 8px;
      border-radius: 6px;
      margin-top: 12px;
    }

    /* ── Scan mode result cards (unchanged) ── */
    .result-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .result-summary.clean   { background: #052e16; border: 1px solid #166534; color: #4ade80; }
    .result-summary.flagged { background: #2d0a0a; border: 1px solid #7f1d1d; color: #f87171; }

    .keyword-list { display: flex; flex-direction: column; gap: 8px; }

    .keyword-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .keyword-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      user-select: none;
    }
    .keyword-header:hover { background: #263348; }
    .keyword-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.found     { background: #f87171; }
    .dot.not-found { background: #334155; }
    .count-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: #7f1d1d;
      color: #fca5a5;
    }
    .chevron { font-size: 10px; color: #475569; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }

    .keyword-contexts { display: none; padding: 0 14px 12px; border-top: 1px solid #1e293b; }
    .keyword-contexts.open { display: block; }
    .context-item {
      margin-top: 8px;
      padding: 8px 10px;
      background: #0f1117;
      border-left: 3px solid #ef4444;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .context-item mark {
      background: #7f1d1d;
      color: #fca5a5;
      border-radius: 2px;
      padding: 0 2px;
    }

    .footer {
      padding: 8px 18px 12px;
      text-align: center;
      font-size: 10px;
      color: #334155;
      border-top: 1px solid #1a2235;
    }

    .mode-hint {
      font-size: 10px;
      color: #475569;
      text-align: center;
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">🔍</span>
    <div>
      <h1>JD Disqualifier Checker</h1>
      <p>Clearance · Onsite · Hybrid · FedRAMP · In-person · Travel</p>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeResume">🚦 Resume Screen</button>
    <button class="mode-btn" id="modeScan">🔎 Full Scan</button>
  </div>

  <div class="body">
    <button class="scan-btn" id="scanBtn">Run Resume Screen</button>
    <div class="mode-hint" id="modeHint">
      Mirrors your AI prompt: EXIT on any disqualifier · PROCEED if fully remote.
    </div>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

  <div class="footer">JD Disqualifier Checker v2.0</div>

  <script src="popup.js"></script>
</body>
</html>
